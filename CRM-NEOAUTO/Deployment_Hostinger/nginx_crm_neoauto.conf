server {
    listen 80;
    server_name crm-neoauto.geeksoft.tech;

    # Servir reportes estáticos del semanal
    location /reportes/ {
        alias /opt/crm_neoauto/reportes/;
        autoindex on;
    }

    # Redirecciones convenientes al index semanal
    location = /reportes {
        return 301 https://$host/reportes/outputs/index.semanal.html;
    }
    location = /reportes/ {
        return 301 https://$host/reportes/outputs/index.semanal.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
